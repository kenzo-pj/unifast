name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "packages/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codspeed-node:
    name: ⚡ CodSpeed (Node.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-node
      - name: 🔨 Build native binding
        run: |
          cargo build -p unifast-bindings-node --release
          mkdir -p packages/node/native
          cp target/release/libunifast_bindings_node.so packages/node/native/unifast.node
      - name: 🏗️ Build packages
        run: pnpm build --filter=@unifast/benchmark...
      - name: 🚀 Run benchmarks
        uses: CodSpeedHQ/action@3194d9a39c4d46684cb44bf7207fc56626aad8fd # v4
        with:
          mode: simulation
          run: pnpm --filter @unifast/benchmark exec vitest bench --run codspeed.bench.ts

  codspeed-rust:
    name: ⚡ CodSpeed (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: 📦 Install cargo-codspeed
        run: cargo install cargo-codspeed --locked
      - name: 🔨 Build benchmarks
        run: cargo codspeed build -m simulation
      - name: 🚀 Run benchmarks
        uses: CodSpeedHQ/action@3194d9a39c4d46684cb44bf7207fc56626aad8fd # v4
        with:
          mode: simulation
          run: cargo codspeed run
